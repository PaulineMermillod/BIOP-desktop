name: "cellpose"
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - cellpose==3.1.1.1
      - scikit-image # for Quality check when training models
      - ipykernel
      - wget # for downloading models
      - fill_voids
      - segment anything
      - torchvision
      - typing_extensions==4.11.0
      
prefix: "/opt/conda/envs/cellpose"